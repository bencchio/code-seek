[package]
name = "code-seek"
version = "0.5.5"
edition = "2024"
description = "Explore the functional structure of a repository from the CLI"
license = "MIT"
repository = "https://github.com/bencchio/code-seek"
readme = "README.md"
keywords = ["cli", "tree-sitter", "code-structure", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-width = "0.2"
toml = "1"
tree-sitter = "=0.26.9"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-qmljs = "0.3.1"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-elixir = "0.3"

[dev-dependencies]
tree-sitter = "=0.26.9"
